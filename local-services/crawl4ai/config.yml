# Complete /app/config.yml for the Crawl4AI 0.9.2 service image.
app:
  host: 0.0.0.0
  port: 11235
  workers: 1
  reload: false

security:
  enabled: true
  jwt_enabled: true

crawler:
  browser:
    headless: true
    extra_args:
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--disable-gpu"
      - "--disable-software-rasterizer"
